# What tools/sync_to_volume.py copies from the repository into the runtime location that your Jobs read.
# Edit this file when your layout changes; it is the one place that says "what runs comes from here".
#
# dest_root can be overridden with --dest. Every `dst` is relative to dest_root unless it starts with / (then it is used as written,
# for example a /Workspace path if you keep contracts there).

dest_root: /Volumes/pipeline_mlb_dev/governance/pipeline

launchers:                 # copied to dest_root
  - run_pipeline.py
  - run_tool.py

zip: code/lakehouse.zip    # built from lakehouse/, src/lib/ and the tools, then copied here

sync:
  # The contracts your Job runs. `contracts` holds the reference FBL contracts and the tix contracts. If you run your OWN FBL
  # contracts, change src to student/contracts (and keep contracts/tix as a second entry).
  - name: contracts
    src: contracts
    dst: contracts
    kind: contracts
    exclude: ["tix"]
  - name: gold transforms
    src: transforms/gold
    dst: transforms/gold
  - name: gold audits (SQL checks the gold stage runs on the staged tables)
    src: transforms/audits
    dst: transforms/audits
  - name: metric view definitions
    src: [sql/metric_views, sql/fbl/metric_views]
    dst: definitions
    flatten: true            # the runner reads one flat folder, matching files by name
    kind: definitions
  - name: catalog (domains, pages, products)
    src: catalog
    dst: catalog
    exclude: ["principals.yml", "__pycache__"]

# Set prune: true on an entry to DELETE files in its destination that no longer exist in the repository.
# Leave it off for any folder that also holds files you put there by hand.
