# Silver contract: player. Rules below are executed by the pipeline's DQ engine.
# action: dedupe/standardize = auto-corrected, quarantine = rejected and kicked back, warn = logged only.
apiVersion: v3.1.0
kind: DataContract
id: fbl.silver.player
name: FBL player (silver)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: Typed, cleaned, deduplicated player rows. Every row here has passed every quarantine rule below.
  limitations: Rejected rows are NOT in this table; they are in governance.dq_quarantine with the reason. Optional
    columns may still be NULL.
  usage: Internal layer for data engineering. Consumers read gold or the semantic layer.
tags:
- fbl
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: fbl.source.player
schema:
- name: fbl_player
  physicalName: silver.fbl_player
  logicalType: object
  physicalType: table
  description: Clean player records.
  customProperties:
  - property: entity
    value: player
  properties:
  - name: player_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Player identifier, e.g. P001. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
    customProperties:
    - property: standardize
      value: upper
  - name: first_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Given name.
  - name: last_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Family name.
  - name: birth_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Date of birth. Personal data. Player must be at least 16.
    classification: personal
  - name: bats
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Batting side: L, R or B (switch).'
    customProperties:
    - property: standardize
      value: upper
  - name: throws
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Throwing hand: L or R.'
    customProperties:
    - property: standardize
      value: upper
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team the player belongs to.
    relationships:
    - to: fbl_team.team_id
      type: foreignKey
    customProperties:
    - property: standardize
      value: upper
  - name: position
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Position code: P, C, 1B, 2B, 3B, SS, LF, CF, RF or DH.'
    customProperties:
    - property: standardize
      value: upper
  - name: height_in
    logicalType: integer
    physicalType: INT
    required: true
    description: Height in inches (60 to 84).
  - name: weight_lb
    logicalType: integer
    physicalType: INT
    required: true
    description: Weight in pounds (120 to 350 expected).
  - name: nickname
    logicalType: string
    physicalType: STRING
    required: false
    description: Optional nickname. Shown as 'None' in gold.
  quality:
  - name: PLR-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate player rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: PLR-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: player_id must identify exactly one player. Conflicting duplicates are rejected for human review
    implementation:
      rule_type: unique_strict
      columns:
      - player_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PLR-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required player fields must be present
    implementation:
      rule_type: not_null
      columns:
      - player_id
      - first_name
      - last_name
      - birth_date
      - bats
      - throws
      - team_id
      - position
      - height_in
      - weight_lb
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PLR-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Bats must be L, R or B
    implementation:
      rule_type: allowed_values
      columns:
      - bats
      expression: '''L'',''R'',''B'''
      action: quarantine
      owner: Baseball Operations
  - name: PLR-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Throws must be L or R
    implementation:
      rule_type: allowed_values
      columns:
      - throws
      expression: '''L'',''R'''
      action: quarantine
      owner: Baseball Operations
  - name: PLR-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Position must be a valid code
    implementation:
      rule_type: allowed_values
      columns:
      - position
      expression: '''P'',''C'',''1B'',''2B'',''3B'',''SS'',''LF'',''CF'',''RF'',''DH'''
      action: quarantine
      owner: Baseball Operations
  - name: PLR-007
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Height must be between 60 and 84 inches
    implementation:
      rule_type: range
      columns:
      - height_in
      expression: 60 AND 84
      action: quarantine
      owner: Baseball Operations
  - name: PLR-008
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: warning
    description: 'Weight outside 120-350 lb is unusual: logged, row kept'
    implementation:
      rule_type: range
      columns:
      - weight_lb
      expression: 120 AND 350
      action: warn
      owner: Baseball Operations
  - name: PLR-009
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: a player must be at least 16 years old (also catches future birth dates)'
    implementation:
      rule_type: custom
      columns:
      - birth_date
      expression: months_between(current_date(), birth_date) >= 16 * 12
      action: quarantine
      owner: Baseball Operations
  - name: PLR-010
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: team_id must exist in the clean team table
    implementation:
      rule_type: referential
      columns:
      - team_id
      expression: silver.fbl_team.team_id
      action: quarantine
      owner: Baseball Operations
  - name: PLR-011
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: warning
    description: bats was trimmed/upper-cased (auto-corrected)
    implementation:
      rule_type: standardized
      columns:
      - bats
      expression: ''
      action: standardize
      owner: Data Engineering
