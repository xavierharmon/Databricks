  quality:
  - name: SEM-FBLB-001
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Home runs by team in the metric view equal the sum from the gold fact.
    implementation:
      test_type: reconcile
      dimensions:
      - team_name
      measures:
      - home_runs
      tolerance: 0
      compare_sql: SELECT t.team_name, SUM(f.hr) AS home_runs FROM gold.fbl_fact_batting f JOIN gold.fbl_dim_team
        t ON f.team_id = t.team_id GROUP BY t.team_name
  - name: SEM-FBLB-002
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Batting average by league equals summed hits over summed at bats from the gold fact (no average
      of averages).
    implementation:
      test_type: reconcile
      dimensions:
      - league
      measures:
      - batting_avg
      tolerance: 1.0e-09
      compare_sql: SELECT t.league, SUM(f.h) / NULLIF(SUM(f.ab), 0) AS batting_avg FROM gold.fbl_fact_batting f
        JOIN gold.fbl_dim_team t ON f.team_id = t.team_id GROUP BY t.league
  - name: SEM-FBLB-003
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Distinct batters per team equals the distinct players in the fact (distinct counts are not additive).
    implementation:
      test_type: reconcile
      dimensions:
      - team_name
      measures:
      - batters
      tolerance: 0
      compare_sql: SELECT t.team_name, COUNT(DISTINCT f.player_id) AS batters FROM gold.fbl_fact_batting f JOIN
        gold.fbl_dim_team t ON f.team_id = t.team_id GROUP BY t.team_name
  - name: SEM-FBLB-004
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: League-wide totals match the fact table.
    implementation:
      test_type: reconcile
      dimensions: []
      measures:
      - home_runs
      - hits
      - at_bats
      tolerance: 0
      compare_sql: SELECT SUM(hr) AS home_runs, SUM(h) AS hits, SUM(ab) AS at_bats FROM gold.fbl_fact_batting
  - name: SEM-FBLB-005
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Rates stay between 0 and 1 for every team and season.
    implementation:
      test_type: bounds
      dimensions:
      - team_name
      - season
      bounds:
        batting_avg:
        - 0
        - 1
        on_base_pct_approx:
        - 0
        - 1
        slugging_pct:
        - 0
        - 4
        home_run_rate:
        - 0
        - 1
