# Semantic contract: mv_fbl_batting (consumer-facing).
# exprHash = fingerprint of each formula. If a formula changes, lint fails until the version is bumped and `contract_tool.py stamp` is run.
apiVersion: v3.1.0
kind: DataContract
id: fbl.semantic.mv_fbl_batting
name: mv_fbl_batting (semantic)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: Governed batting metrics for the Fictional Baseball League. Consumers group and filter by season, player,
    team, league, city, position or batting hand.
  limitations: OBP and OPS are approximations (no hit-by-pitch or sacrifice-fly data). Distinct counts (batters)
    cannot be summed across groups. Only rows that passed silver quality are included.
  usage: SELECT dim, MEASURE(measure) FROM semantic.mv_fbl_batting GROUP BY dim. Do not query the gold tables directly
    for ratios.
tags:
- fbl
- semantic
customProperties:
- property: layer
  value: semantic
- property: owner
  value: Analytics Engineering
- property: strictTypes
  value: false
slaProperties:
- property: freshness
  value: 24
  unit: h
  element: mv_fbl_batting
- property: frequency
  value: 1
  unit: d
  element: mv_fbl_batting
schema:
- name: mv_fbl_batting
  physicalName: semantic.mv_fbl_batting
  logicalType: object
  physicalType: view
  description: Governed batting metrics for the Fictional Baseball League. Consumers group and filter by season,
    player, team, league, city, position or batting hand.
  customProperties:
