# Silver contract: team. Rules below are executed by the pipeline's DQ engine.
# action: dedupe/standardize = auto-corrected, quarantine = rejected and kicked back, warn = logged only.
apiVersion: v3.1.0
kind: DataContract
id: fbl.silver.team
name: FBL team (silver)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: Typed, cleaned, deduplicated team rows. Every row here has passed every quarantine rule below.
  limitations: Rejected rows are NOT in this table; they are in governance.dq_quarantine with the reason. Optional
    columns may still be NULL.
  usage: Internal layer for data engineering. Consumers read gold or the semantic layer.
tags:
- fbl
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: fbl.source.team
schema:
- name: fbl_team
  physicalName: silver.fbl_team
  logicalType: object
  physicalType: table
  description: Clean team records.
  customProperties:
  - property: entity
    value: team
  properties:
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team identifier, e.g. T01. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
    customProperties:
    - property: standardize
      value: upper
  - name: team_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Full team name.
  - name: city
    logicalType: string
    physicalType: STRING
    required: true
    description: Home city.
  - name: league
    logicalType: string
    physicalType: STRING
    required: true
    description: 'League: North or South.'
    customProperties:
    - property: standardize
      value: initcap
  - name: founded_year
    logicalType: integer
    physicalType: INT
    required: true
    description: Year the franchise was founded (league started in 2000).
  - name: home_park
    logicalType: string
    physicalType: STRING
    required: true
    description: Home ballpark.
  - name: payroll_cap_musd
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Payroll cap in millions of USD. Must be positive.
  - name: mascot
    logicalType: string
    physicalType: STRING
    required: false
    description: 'Team mascot. Optional: shown as ''None'' in gold.'
  quality:
  - name: TEAM-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate team rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: TEAM-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: team_id must identify exactly one team. Conflicting duplicates are rejected for human review
    implementation:
      rule_type: unique_strict
      columns:
      - team_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TEAM-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required team fields must be present
    implementation:
      rule_type: not_null
      columns:
      - team_id
      - team_name
      - city
      - league
      - founded_year
      - home_park
      - payroll_cap_musd
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TEAM-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: League must be North or South
    implementation:
      rule_type: allowed_values
      columns:
      - league
      expression: '''North'',''South'''
      action: quarantine
      owner: Baseball Operations
  - name: TEAM-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Founded year must be between 2000 and the current year (league started in 2000)
    implementation:
      rule_type: range
      columns:
      - founded_year
      expression: 2000 AND year(current_date())
      action: quarantine
      owner: Baseball Operations
  - name: TEAM-006
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: payroll cap must be a positive number of millions'
    implementation:
      rule_type: custom
      columns:
      - payroll_cap_musd
      expression: payroll_cap_musd > 0
      action: quarantine
      owner: Baseball Finance
  - name: TEAM-007
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: warning
    description: League text was trimmed/re-cased (auto-corrected)
    implementation:
      rule_type: standardized
      columns:
      - league
      expression: ''
      action: standardize
      owner: Data Engineering
  - name: TEAM-008
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: warning
    description: team_id was trimmed/upper-cased (auto-corrected)
    implementation:
      rule_type: standardized
      columns:
      - team_id
      expression: ''
      action: standardize
      owner: Data Engineering
