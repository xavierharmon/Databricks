# Silver contract: batting. Rules below are executed by the pipeline's DQ engine.
# action: dedupe/standardize = auto-corrected, quarantine = rejected and kicked back, warn = logged only.
apiVersion: v3.1.0
kind: DataContract
id: fbl.silver.batting
name: FBL batting (silver)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: Typed, cleaned, deduplicated batting rows. Every row here has passed every quarantine rule below.
  limitations: Rejected rows are NOT in this table; they are in governance.dq_quarantine with the reason. Optional
    columns may still be NULL.
  usage: Internal layer for data engineering. Consumers read gold or the semantic layer.
tags:
- fbl
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: fbl.source.batting
schema:
- name: fbl_batting
  physicalName: silver.fbl_batting
  logicalType: object
  physicalType: table
  description: Clean batting records.
  customProperties:
  - property: entity
    value: batting
  properties:
  - name: player_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Player. Part of the key.
    primaryKey: true
    primaryKeyPosition: 1
    relationships:
    - to: fbl_player.player_id
      type: foreignKey
    customProperties:
    - property: standardize
      value: upper
  - name: season
    logicalType: integer
    physicalType: INT
    required: true
    description: Season year. Part of the key.
    primaryKey: true
    primaryKeyPosition: 2
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team played for. Part of the key.
    primaryKey: true
    primaryKeyPosition: 3
    relationships:
    - to: fbl_team.team_id
      type: foreignKey
    customProperties:
    - property: standardize
      value: upper
  - name: g
    logicalType: integer
    physicalType: INT
    required: true
    description: Games played (0 to 162).
  - name: ab
    logicalType: integer
    physicalType: INT
    required: true
    description: At bats.
  - name: h
    logicalType: integer
    physicalType: INT
    required: true
    description: Hits. Cannot exceed at bats.
  - name: doubles
    logicalType: integer
    physicalType: INT
    required: true
    description: Doubles.
  - name: triples
    logicalType: integer
    physicalType: INT
    required: true
    description: Triples.
  - name: hr
    logicalType: integer
    physicalType: INT
    required: true
    description: Home runs. Cannot exceed hits.
  - name: rbi
    logicalType: integer
    physicalType: INT
    required: true
    description: Runs batted in.
  - name: bb
    logicalType: integer
    physicalType: INT
    required: true
    description: Walks.
  - name: so
    logicalType: integer
    physicalType: INT
    required: true
    description: Strikeouts.
  - name: sb
    logicalType: integer
    physicalType: INT
    required: true
    description: Stolen bases. Cannot be negative.
  quality:
  - name: BAT-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate batting rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: BAT-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: One batting line per player, season and team. Conflicting duplicates are rejected for human review
    implementation:
      rule_type: unique_strict
      columns:
      - player_id
      - season
      - team_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: BAT-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required batting fields must be present (non-numeric text becomes NULL and is caught here)
    implementation:
      rule_type: not_null
      columns:
      - player_id
      - season
      - team_id
      - g
      - ab
      - h
      - doubles
      - triples
      - hr
      - rbi
      - bb
      - so
      - sb
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: BAT-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Season must be between 2008 and the current year
    implementation:
      rule_type: range
      columns:
      - season
      expression: 2008 AND year(current_date())
      action: quarantine
      owner: Baseball Operations
  - name: BAT-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Games played must be between 0 and 162
    implementation:
      rule_type: range
      columns:
      - g
      expression: 0 AND 162
      action: quarantine
      owner: Baseball Operations
  - name: BAT-006
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: hits cannot exceed at bats'
    implementation:
      rule_type: custom
      columns:
      - h
      expression: h <= ab
      action: quarantine
      owner: Baseball Operations
  - name: BAT-007
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: home runs cannot exceed hits'
    implementation:
      rule_type: custom
      columns:
      - hr
      expression: hr <= h
      action: quarantine
      owner: Baseball Operations
  - name: BAT-008
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: extra-base hits cannot exceed total hits'
    implementation:
      rule_type: custom
      columns:
      - h
      expression: doubles + triples + hr <= h
      action: quarantine
      owner: Baseball Operations
  - name: BAT-009
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: no more than 6 at bats per game played'
    implementation:
      rule_type: custom
      columns:
      - ab
      expression: ab <= g * 6
      action: quarantine
      owner: Baseball Operations
  - name: BAT-010
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rule: counting stats cannot be negative'
    implementation:
      rule_type: custom
      columns:
      - ab
      expression: ab >= 0 AND h >= 0 AND doubles >= 0 AND triples >= 0 AND hr >= 0 AND rbi >= 0 AND bb >= 0 AND
        so >= 0 AND sb >= 0
      action: quarantine
      owner: Baseball Operations
  - name: BAT-011
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: player_id must exist in the clean player table
    implementation:
      rule_type: referential
      columns:
      - player_id
      expression: silver.fbl_player.player_id
      action: quarantine
      owner: Baseball Operations
  - name: BAT-012
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: team_id must exist in the clean team table
    implementation:
      rule_type: referential
      columns:
      - team_id
      expression: silver.fbl_team.team_id
      action: quarantine
      owner: Baseball Operations
