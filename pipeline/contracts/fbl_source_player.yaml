# Source contract: players.csv. Bronze front door.
# ODCS v3.1-style. Rows are NOT validated here, only the file shape.
apiVersion: v3.1.0
kind: DataContract
id: fbl.source.player
name: FBL player file (as delivered)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: 'The players.csv file the league office sends us. Promise: the listed columns are present and the file
    is not empty.'
  limitations: Values arrive as text and may be blank, duplicated, mis-cased or invalid. Row-level validity is NOT
    promised here; silver enforces it.
  usage: Load as strings into bronze. Never clean values before bronze.
tags:
- fbl
- source
customProperties:
- property: layer
  value: source
- property: owner
  value: Baseball Operations (file owner)
- property: sourceSystem
  value: league_office_csv
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: fbl_player
- property: timeOfAvailability
  value: 06:00
  unit: UTC
  element: fbl_player
schema:
- name: fbl_player
  physicalName: bronze.fbl_player
  logicalType: object
  physicalType: table
  description: Raw players.csv, all columns as delivered.
  customProperties:
  - property: entity
    value: player
  - property: landingFolder
    value: players
  - property: fileName
    value: players.csv
  quality:
  - metric: rowCount
    mustBeGreaterThan: 0
    type: library
    dimension: completeness
    severity: error
    description: The delivered file must contain at least one row.
  properties:
  - name: player_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Player identifier, e.g. P001. Primary key. (raw text, present in the file header)
  - name: first_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Given name. (raw text, present in the file header)
  - name: last_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Family name. (raw text, present in the file header)
  - name: birth_date
    logicalType: string
    physicalType: STRING
    required: true
    description: Date of birth. Personal data. Player must be at least 16. (raw text, present in the file header)
  - name: bats
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Batting side: L, R or B (switch). (raw text, present in the file header)'
  - name: throws
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Throwing hand: L or R. (raw text, present in the file header)'
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team the player belongs to. (raw text, present in the file header)
  - name: position
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Position code: P, C, 1B, 2B, 3B, SS, LF, CF, RF or DH. (raw text, present in the file header)'
  - name: height_in
    logicalType: string
    physicalType: STRING
    required: true
    description: Height in inches (60 to 84). (raw text, present in the file header)
  - name: weight_lb
    logicalType: string
    physicalType: STRING
    required: true
    description: Weight in pounds (120 to 350 expected). (raw text, present in the file header)
  - name: nickname
    logicalType: string
    physicalType: STRING
    required: true
    description: Optional nickname. Shown as 'None' in gold. (raw text, present in the file header)
