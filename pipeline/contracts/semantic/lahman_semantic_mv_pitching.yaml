  quality:
  - name: SEM-LP-001
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: 2001 league-wide strikeouts match the raw Lahman file.
    implementation:
      test_type: expect
      dimensions:
      - season
      measures:
      - strikeouts
      where: season = 2001
      expect:
      - season: 2001
        strikeouts: 32404
      tolerance: 0
  - name: SEM-LP-002
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Strikeouts by season equal the sum from the gold fact.
    implementation:
      test_type: reconcile
      dimensions:
      - season
      measures:
      - strikeouts
      tolerance: 0
      compare_sql: SELECT season, SUM(so) AS strikeouts FROM gold.fact_pitching_season GROUP BY season
  - name: SEM-LP-003
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Win percentage is between 0 and 1 for every season.
    implementation:
      test_type: bounds
      dimensions:
      - season
      bounds:
        win_pct:
        - 0
        - 1
