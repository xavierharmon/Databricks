# Semantic contract: mv_pitching (Lahman MLB).
# Golden values were computed from the raw Lahman CSVs, independent of the pipeline.
apiVersion: v3.1.0
kind: DataContract
id: lahman.semantic.mv_pitching
name: mv_pitching (semantic)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: lahman
description:
  purpose: Governed pitching metrics for MLB 1871-2020 (Lahman). Rates use outs (ipouts / 3), not decimal innings.
  limitations: Older seasons have missing strikeout and walk detail. Distinct counts are not additive.
  usage: SELECT dim, MEASURE(measure) FROM semantic.mv_pitching GROUP BY dim.
tags:
- lahman
- semantic
