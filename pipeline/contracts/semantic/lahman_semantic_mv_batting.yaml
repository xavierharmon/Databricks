# Semantic contract: mv_batting (Lahman MLB).
# Golden values were computed from the raw Lahman CSVs, independent of the pipeline.
apiVersion: v3.1.0
kind: DataContract
id: lahman.semantic.mv_batting
name: mv_batting (semantic)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: lahman
description:
  purpose: Governed batting metrics for MLB 1871-2020 (Lahman). Ratios are computed from summed components.
  limitations: NULL means not recorded (e.g. no sacrifice flies before 1954), not zero. Distinct counts are not
    additive.
  usage: SELECT dim, MEASURE(measure) FROM semantic.mv_batting GROUP BY dim.
tags:
- lahman
- semantic
customProperties:
- property: layer
  value: semantic
- property: owner
  value: Analytics Engineering
- property: strictTypes
  value: false
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: mv_batting
