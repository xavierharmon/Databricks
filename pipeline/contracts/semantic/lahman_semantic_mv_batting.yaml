  quality:
  - name: SEM-LB-001
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Bonds 2001 returns the record-book home runs and batting average.
    implementation:
      test_type: expect
      dimensions:
      - player_name
      - season
      measures:
      - home_runs
      - batting_avg
      where: player_name = 'Barry Bonds' AND season = 2001
      expect:
      - player_name: Barry Bonds
        season: 2001
        home_runs: 73
        batting_avg: 0.3277
      tolerance: 0.0005
  - name: SEM-LB-002
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Home runs by season equal the sum from the gold fact.
    implementation:
      test_type: reconcile
      dimensions:
      - season
      measures:
      - home_runs
      tolerance: 0
      compare_sql: SELECT season, SUM(hr) AS home_runs FROM gold.fact_batting_season GROUP BY season
  - name: SEM-LB-003
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: 2001 league-wide home runs match the raw Lahman file.
    implementation:
      test_type: expect
      dimensions:
      - season
      measures:
      - home_runs
      where: season = 2001
      expect:
      - season: 2001
        home_runs: 5458
      tolerance: 0
  - name: SEM-LB-004
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Batting average is between 0 and 1 for every season and league.
    implementation:
      test_type: bounds
      dimensions:
      - season
      - league
      bounds:
        batting_avg:
        - 0
        - 1
