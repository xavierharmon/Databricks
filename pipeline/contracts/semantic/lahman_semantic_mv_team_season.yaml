  quality:
  - name: SEM-LT-001
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: The 2001 Seattle Mariners show the record 116 wins and a +300 run differential.
    implementation:
      test_type: expect
      dimensions:
      - team_name
      - season
      measures:
      - wins
      - run_differential
      where: team_name = 'Seattle Mariners' AND season = 2001
      expect:
      - team_name: Seattle Mariners
        season: 2001
        wins: 116
        run_differential: 300
      tolerance: 0
  - name: SEM-LT-002
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Wins by season equal the sum from the gold fact.
    implementation:
      test_type: reconcile
      dimensions:
      - season
      measures:
      - wins
      tolerance: 0
      compare_sql: SELECT season, SUM(w) AS wins FROM gold.fact_team_season GROUP BY season
  - name: SEM-LT-003
    type: custom
    engine: fbl-semantic-checks
    dimension: accuracy
    severity: error
    description: Win percentage is between 0 and 1.
    implementation:
      test_type: bounds
      dimensions:
      - season
      bounds:
        win_pct:
        - 0
        - 1
