# Semantic contract: mv_team_season (Lahman MLB).
# Golden values were computed from the raw Lahman CSVs, independent of the pipeline.
apiVersion: v3.1.0
kind: DataContract
id: lahman.semantic.mv_team_season
name: mv_team_season (semantic)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: lahman
description:
  purpose: Governed team-season metrics (results, run environment, attendance, payroll) for MLB 1871-2020 (Lahman).
  limitations: Payroll exists from 1985 only and is NULL before. Cost per win only counts seasons with payroll.
  usage: SELECT dim, MEASURE(measure) FROM semantic.mv_team_season GROUP BY dim.
tags:
- lahman
- semantic
customProperties:
- property: layer
  value: semantic
- property: owner
  value: Analytics Engineering
- property: strictTypes
  value: false
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: mv_team_season
schema:
