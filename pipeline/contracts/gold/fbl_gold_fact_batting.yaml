# Gold contract: fact_batting. Violating any rule stops the job (action: fail).
apiVersion: v3.1.0
kind: DataContract
id: fbl.gold.fact_batting
name: FBL fact_batting (gold)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: 'Batting fact: one row per player, season and team. Additive components only; ratios live in the semantic
    layer.'
  limitations: 'Gold never contains NULLs. Optional text is labeled ''None''. Numeric facts are never defaulted:
    bad rows are rejected in silver.'
  usage: Safe for analysts and the semantic layer. Prefer the metric views for ratios.
tags:
- fbl
- gold
customProperties:
- property: layer
  value: gold
- property: owner
  value: Data Engineering
- property: dependsOn
  value: fbl.silver.batting
- property: consumers
  value:
  - fbl.semantic.mv_fbl_batting
  - fbl.semantic.mv_fbl_roster
slaProperties:
- property: freshness
  value: 24
  unit: h
  element: fact_batting
- property: frequency
  value: 1
  unit: d
  element: fact_batting
schema:
- name: fact_batting
  physicalName: gold.fbl_fact_batting
  logicalType: object
  physicalType: table
  description: 'Batting fact: one row per player, season and team. Additive components only; ratios live in the
    semantic layer.'
  customProperties:
  - property: entity
    value: fact_batting
  - property: reconcilesTo
    value: silver.fbl_batting
  properties:
  - name: player_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Player. Part of the key.
    primaryKey: true
    primaryKeyPosition: 1
    relationships:
    - to: dim_player.player_id
      type: foreignKey
  - name: season
    logicalType: integer
    physicalType: INT
    required: true
    description: Season year. Part of the key.
    primaryKey: true
    primaryKeyPosition: 2
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team played for. Part of the key.
    primaryKey: true
    primaryKeyPosition: 3
    relationships:
    - to: dim_team.team_id
      type: foreignKey
  - name: g
    logicalType: integer
    physicalType: INT
    required: true
    description: Games played (0 to 162).
  - name: ab
    logicalType: integer
    physicalType: INT
    required: true
    description: At bats.
  - name: h
    logicalType: integer
    physicalType: INT
    required: true
    description: Hits. Cannot exceed at bats.
  - name: doubles
    logicalType: integer
    physicalType: INT
    required: true
    description: Doubles.
  - name: triples
    logicalType: integer
    physicalType: INT
    required: true
    description: Triples.
  - name: hr
    logicalType: integer
    physicalType: INT
    required: true
    description: Home runs. Cannot exceed hits.
  - name: rbi
    logicalType: integer
    physicalType: INT
    required: true
    description: Runs batted in.
  - name: bb
    logicalType: integer
    physicalType: INT
    required: true
    description: Walks.
  - name: so
    logicalType: integer
    physicalType: INT
    required: true
    description: Strikeouts.
  - name: sb
    logicalType: integer
    physicalType: INT
    required: true
    description: Stolen bases. Cannot be negative.
  - name: singles
    logicalType: integer
    physicalType: INT
    required: true
    description: 'Derived: hits - doubles - triples - home runs.'
  - name: total_bases
    logicalType: integer
    physicalType: INT
    required: true
    description: 'Derived: 1B + 2*2B + 3*3B + 4*HR.'
  - name: plate_appearances_approx
    logicalType: integer
    physicalType: INT
    required: true
    description: 'Derived: at bats + walks (approximation).'
  quality:
  - metric: rowCount
    mustBeGreaterThan: 0
    type: library
    dimension: completeness
    severity: error
    description: Gold table must not be empty.
  - name: GLD-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: 'Gold guarantee: no NULL in any fact_batting column'
    implementation:
      rule_type: no_nulls
      columns: '*'
      expression: ''
      action: fail
      owner: Data Engineering
  - name: GLD-006
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: 'fact_batting grain: one row per player, season, team'
    implementation:
      rule_type: unique
      columns:
      - player_id
      - season
      - team_id
      expression: ''
      action: fail
      owner: Data Engineering
  - name: GLD-007
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Every batting row must have a player in dim_player
    implementation:
      rule_type: referential
      columns:
      - player_id
      expression: gold.fbl_dim_player.player_id
      action: fail
      owner: Data Engineering
  - name: GLD-008
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Every batting row must have a team in dim_team
    implementation:
      rule_type: referential
      columns:
      - team_id
      expression: gold.fbl_dim_team.team_id
      action: fail
      owner: Data Engineering
  - name: GLD-010
    type: custom
    engine: fbl-dq-engine
    dimension: accuracy
    severity: error
    description: 'Business rules re-checked on gold: hits, home runs and at bats are consistent'
    implementation:
      rule_type: custom
      columns:
      - h
      expression: h <= ab AND hr <= h AND ab <= g * 6
      action: fail
      owner: Data Engineering
