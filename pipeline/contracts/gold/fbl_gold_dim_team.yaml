# Gold contract: dim_team. Violating any rule stops the job (action: fail).
apiVersion: v3.1.0
kind: DataContract
id: fbl.gold.dim_team
name: FBL dim_team (gold)
version: 1.0.0
status: active
domain: baseball_operations
dataProduct: fbl
description:
  purpose: 'Team dimension: one row per team.'
  limitations: 'Gold never contains NULLs. Optional text is labeled ''None''. Numeric facts are never defaulted:
    bad rows are rejected in silver.'
  usage: Safe for analysts and the semantic layer. Prefer the metric views for ratios.
tags:
- fbl
- gold
customProperties:
- property: layer
  value: gold
- property: owner
  value: Data Engineering
- property: dependsOn
  value: fbl.silver.team
- property: consumers
  value:
  - fbl.semantic.mv_fbl_batting
  - fbl.semantic.mv_fbl_roster
slaProperties:
- property: freshness
  value: 24
  unit: h
  element: dim_team
- property: frequency
  value: 1
  unit: d
  element: dim_team
schema:
- name: dim_team
  physicalName: gold.fbl_dim_team
  logicalType: object
  physicalType: table
  description: 'Team dimension: one row per team.'
  customProperties:
  - property: entity
    value: dim_team
  - property: reconcilesTo
    value: silver.fbl_team
  properties:
  - name: team_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Team identifier, e.g. T01. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: team_name
    logicalType: string
    physicalType: STRING
    required: true
    description: Full team name.
  - name: city
    logicalType: string
    physicalType: STRING
    required: true
    description: Home city.
  - name: league
    logicalType: string
    physicalType: STRING
    required: true
    description: 'League: North or South.'
  - name: founded_year
    logicalType: integer
    physicalType: INT
    required: true
    description: Year the franchise was founded (league started in 2000).
  - name: home_park
    logicalType: string
    physicalType: STRING
    required: true
    description: Home ballpark.
  - name: payroll_cap_musd
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: Payroll cap in millions of USD. Must be positive.
  - name: mascot
    logicalType: string
    physicalType: STRING
    required: true
    description: 'Team mascot. Gold guarantee: never NULL; the label ''None'' means not provided.'
  quality:
  - metric: rowCount
    mustBeGreaterThan: 0
    type: library
    dimension: completeness
    severity: error
    description: Gold table must not be empty.
  - name: GLD-001
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: 'Gold guarantee: no NULL in any dim_team column'
    implementation:
      rule_type: no_nulls
      columns: '*'
      expression: ''
      action: fail
      owner: Data Engineering
  - name: GLD-004
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: 'dim_team grain: one row per team_id'
    implementation:
      rule_type: unique
      columns:
      - team_id
      expression: ''
      action: fail
      owner: Data Engineering
