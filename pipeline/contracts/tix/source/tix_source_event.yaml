# Source contract: event. Generated by tools/build_tix_contracts.py. Bronze front door; rows are not validated here.
apiVersion: v3.1.0
kind: DataContract
id: tix.source.event
name: tix event file (as delivered)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: 'The event file: the listed columns are present and the file is not empty.'
  limitations: Values arrive as text and may be blank, duplicated or invalid. Row-level validity is NOT promised here; silver
    enforces it.
  usage: Load as strings into bronze.
tags:
- tix
- source
customProperties:
- property: layer
  value: source
- property: owner
  value: Data Engineering
- property: sourceSystem
  value: tix_generator_csv
schema:
- name: tix_event
  physicalName: bronze.tix_event
  logicalType: object
  physicalType: table
  description: Raw event file, all columns as delivered.
  customProperties:
  - property: entity
    value: event
  - property: landingFolder
    value: event
  quality:
  - metric: rowCount
    mustBeGreaterThan: 0
    type: library
    dimension: completeness
    severity: error
    description: The delivered files must contain at least one row.
  properties:
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event id. Primary key. (raw text, present in the file header)
  - name: event_title
    logicalType: string
    physicalType: STRING
    required: true
    description: event title (raw text, present in the file header)
  - name: event_category
    logicalType: string
    physicalType: STRING
    required: true
    description: sport or concert. (raw text, present in the file header)
  - name: sport
    logicalType: string
    physicalType: STRING
    required: true
    description: baseball, football or basketball; blank for a concert. (raw text, present in the file header)
  - name: league
    logicalType: string
    physicalType: STRING
    required: true
    description: League for a sport; blank for a concert. (raw text, present in the file header)
  - name: venue_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Venue of the event. (raw text, present in the file header)
  - name: start_ts
    logicalType: string
    physicalType: STRING
    required: true
    description: Event start, UTC. (raw text, present in the file header)
  - name: on_sale_ts
    logicalType: string
    physicalType: STRING
    required: true
    description: When tickets go on sale, UTC. (raw text, present in the file header)
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    description: scheduled or cancelled. (raw text, present in the file header)
