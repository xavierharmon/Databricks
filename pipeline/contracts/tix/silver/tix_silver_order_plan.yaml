# Silver contract: order_plan. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.order_plan
name: tix order_plan (silver)
version: 1.0.0
status: active
domain: sales
dataProduct: tix
description:
  purpose: One order and its payment plan. Typed, cleaned, deduplicated. Every row has passed every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.order_plan
schema:
- name: tix_order_plan
  physicalName: silver.tix_order_plan
  logicalType: object
  physicalType: table
  description: One order and its payment plan.
  customProperties:
  - property: entity
    value: order_plan
  properties:
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Order id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Buyer.
    relationships:
    - to: tix_customer.customer_id
      type: foreignKey
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event.
    relationships:
    - to: tix_event.event_id
      type: foreignKey
  - name: order_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Order time, UTC.
  - name: total_amount
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Order total.
  - name: num_payments
    logicalType: integer
    physicalType: INT
    required: true
    description: Payments in the plan (1 means paid in full).
  - name: plan_interval_days
    logicalType: integer
    physicalType: INT
    required: true
    description: Days between payments.
  - name: sale_type
    logicalType: string
    physicalType: STRING
    required: true
    description: primary, resale or company_resale.
  quality:
  - name: ORD-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate order_plan rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: ORD-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: One order id means one order
    implementation:
      rule_type: unique_strict
      columns:
      - order_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: ORD-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required order fields must be present
    implementation:
      rule_type: not_null
      columns:
      - order_id
      - customer_id
      - event_id
      - order_ts
      - total_amount
      - num_payments
      - plan_interval_days
      - sale_type
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: ORD-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Orders are primary, resale or company resale
    implementation:
      rule_type: allowed_values
      columns:
      - sale_type
      expression: '''primary'',''resale'',''company_resale'''
      action: quarantine
      owner: Data Engineering
  - name: ORD-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A plan has 1 to 10 payments
    implementation:
      rule_type: range
      columns:
      - num_payments
      expression: 1 AND 10
      action: quarantine
      owner: Data Engineering
  - name: ORD-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: An order total is positive
    implementation:
      rule_type: custom
      columns: []
      expression: total_amount > 0
      action: quarantine
      owner: Data Engineering
  - name: ORD-007
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The buyer must exist
    implementation:
      rule_type: referential
      columns:
      - customer_id
      expression: silver.tix_customer.customer_id
      action: quarantine
      owner: Data Engineering
  - name: ORD-008
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The event must exist
    implementation:
      rule_type: referential
      columns:
      - event_id
      expression: silver.tix_event.event_id
      action: quarantine
      owner: Data Engineering
