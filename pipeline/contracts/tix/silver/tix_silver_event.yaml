# Silver contract: event. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.event
name: tix event (silver)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: 'Every ticketed occasion: sports and special events share this one table. Typed, cleaned, deduplicated. Every row
    has passed every quarantine rule.'
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.event
schema:
- name: tix_event
  physicalName: silver.tix_event
  logicalType: object
  physicalType: table
  description: 'Every ticketed occasion: sports and special events share this one table.'
  customProperties:
  - property: entity
    value: event
  properties:
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: event_title
    logicalType: string
    physicalType: STRING
    required: true
    description: event title
  - name: event_category
    logicalType: string
    physicalType: STRING
    required: true
    description: sport or concert.
  - name: sport
    logicalType: string
    physicalType: STRING
    required: false
    description: baseball, football or basketball; blank for a concert.
  - name: league
    logicalType: string
    physicalType: STRING
    required: false
    description: League for a sport; blank for a concert.
  - name: venue_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Venue of the event.
    relationships:
    - to: tix_venue.venue_id
      type: foreignKey
  - name: start_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Event start, UTC.
  - name: on_sale_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When tickets go on sale, UTC.
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    description: scheduled or cancelled.
  quality:
  - name: EVT-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate event rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: EVT-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: event_id must identify exactly one event
    implementation:
      rule_type: unique_strict
      columns:
      - event_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: EVT-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required event fields must be present
    implementation:
      rule_type: not_null
      columns:
      - event_id
      - event_title
      - event_category
      - venue_id
      - start_ts
      - on_sale_ts
      - status
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: EVT-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: event_category must be sport or concert
    implementation:
      rule_type: allowed_values
      columns:
      - event_category
      expression: '''sport'',''concert'''
      action: quarantine
      owner: Data Engineering
  - name: EVT-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: status must be scheduled or cancelled
    implementation:
      rule_type: allowed_values
      columns:
      - status
      expression: '''scheduled'',''cancelled'''
      action: quarantine
      owner: Data Engineering
  - name: EVT-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A sport must be baseball, football or basketball
    implementation:
      rule_type: allowed_values
      columns:
      - sport
      expression: '''baseball'',''football'',''basketball'''
      action: quarantine
      owner: Data Engineering
  - name: EVT-007
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A concert has no sport
    implementation:
      rule_type: custom
      columns: []
      expression: event_category <> 'concert' OR sport IS NULL
      action: quarantine
      owner: Data Engineering
  - name: EVT-008
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Tickets go on sale before the event starts
    implementation:
      rule_type: custom
      columns: []
      expression: on_sale_ts < start_ts
      action: quarantine
      owner: Data Engineering
  - name: EVT-009
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Every event must name a known venue
    implementation:
      rule_type: referential
      columns:
      - venue_id
      expression: silver.tix_venue.venue_id
      action: quarantine
      owner: Data Engineering
