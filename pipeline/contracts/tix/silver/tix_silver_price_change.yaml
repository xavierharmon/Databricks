# Silver contract: price_change. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.price_change
name: tix price_change (silver)
version: 1.0.0
status: active
domain: sales
dataProduct: tix
description:
  purpose: 'Every price change for an event section: the price history. Typed, cleaned, deduplicated. Every row has passed
    every quarantine rule.'
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.price_change
schema:
- name: tix_price_change
  physicalName: silver.tix_price_change
  logicalType: object
  physicalType: table
  description: 'Every price change for an event section: the price history.'
  customProperties:
  - property: entity
    value: price_change
  properties:
  - name: price_change_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Price change id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event.
    relationships:
    - to: tix_event.event_id
      type: foreignKey
  - name: section
    logicalType: string
    physicalType: STRING
    required: true
    description: section
  - name: effective_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: The price applies from this time, UTC.
  - name: price
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Price from then on.
  quality:
  - name: PRC-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate price_change rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: PRC-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: One id means one change
    implementation:
      rule_type: unique_strict
      columns:
      - price_change_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PRC-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required fields must be present
    implementation:
      rule_type: not_null
      columns:
      - price_change_id
      - event_id
      - section
      - effective_ts
      - price
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PRC-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A plausible price
    implementation:
      rule_type: range
      columns:
      - price
      expression: 1 AND 100000
      action: quarantine
      owner: Data Engineering
  - name: PRC-005
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The event must exist
    implementation:
      rule_type: referential
      columns:
      - event_id
      expression: silver.tix_event.event_id
      action: quarantine
      owner: Data Engineering
