# Silver contract: venue. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.venue
name: tix venue (silver)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: Venues where events are held. Typed, cleaned, deduplicated. Every row has passed every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.venue
schema:
- name: tix_venue
  physicalName: silver.tix_venue
  logicalType: object
  physicalType: table
  description: Venues where events are held.
  customProperties:
  - property: entity
    value: venue
  properties:
  - name: venue_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Venue id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: venue_name
    logicalType: string
    physicalType: STRING
    required: true
    description: venue name
  - name: city
    logicalType: string
    physicalType: STRING
    required: true
    description: city
  - name: timezone
    logicalType: string
    physicalType: STRING
    required: true
    description: timezone
  quality:
  - name: VEN-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate venue rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: VEN-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: venue_id must identify exactly one venue
    implementation:
      rule_type: unique_strict
      columns:
      - venue_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: VEN-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Venue fields must be present
    implementation:
      rule_type: not_null
      columns:
      - venue_id
      - venue_name
      - city
      - timezone
      expression: ''
      action: quarantine
      owner: Data Engineering
