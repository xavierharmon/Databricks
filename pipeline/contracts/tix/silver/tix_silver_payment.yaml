# Silver contract: payment. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.payment
name: tix payment (silver)
version: 1.0.0
status: active
domain: sales
dataProduct: tix
description:
  purpose: Every payment attempt, refund and chargeback against an order. Typed, cleaned, deduplicated. Every row has passed
    every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.payment
schema:
- name: tix_payment
  physicalName: silver.tix_payment
  logicalType: object
  physicalType: table
  description: Every payment attempt, refund and chargeback against an order.
  customProperties:
  - property: entity
    value: payment
  properties:
  - name: payment_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Payment attempt id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Order paid.
    relationships:
    - to: tix_order_plan.order_id
      type: foreignKey
  - name: payment_seq
    logicalType: integer
    physicalType: INT
    required: true
    description: Which installment (1 to 10).
  - name: attempt_no
    logicalType: integer
    physicalType: INT
    required: true
    description: 1 for the first try, 2 for a retry.
  - name: due_date
    logicalType: date
    physicalType: DATE
    required: true
    description: Installment due date.
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When this attempt or refund happened, UTC.
  - name: amount
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Amount.
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    description: captured, failed, refunded or chargeback.
  - name: original_payment_id
    logicalType: string
    physicalType: STRING
    required: false
    description: For a refund, the payment it reverses.
  quality:
  - name: PAY-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate payment rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: PAY-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: One payment id means one payment event
    implementation:
      rule_type: unique_strict
      columns:
      - payment_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PAY-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required payment fields must be present
    implementation:
      rule_type: not_null
      columns:
      - payment_id
      - order_id
      - payment_seq
      - attempt_no
      - due_date
      - event_ts
      - amount
      - status
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PAY-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A known payment status
    implementation:
      rule_type: allowed_values
      columns:
      - status
      expression: '''captured'',''failed'',''refunded'',''chargeback'''
      action: quarantine
      owner: Data Engineering
  - name: PAY-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Installments are numbered 1 to 10
    implementation:
      rule_type: range
      columns:
      - payment_seq
      expression: 1 AND 10
      action: quarantine
      owner: Data Engineering
  - name: PAY-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: An amount is positive; refunds are a status, not a negative number
    implementation:
      rule_type: custom
      columns: []
      expression: amount > 0
      action: quarantine
      owner: Data Engineering
  - name: PAY-007
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The order must exist
    implementation:
      rule_type: referential
      columns:
      - order_id
      expression: silver.tix_order_plan.order_id
      action: quarantine
      owner: Data Engineering
