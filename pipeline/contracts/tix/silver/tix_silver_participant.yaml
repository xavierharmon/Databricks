# Silver contract: participant. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.participant
name: tix participant (silver)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: Teams and performers that take part in events. Typed, cleaned, deduplicated. Every row has passed every quarantine
    rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.participant
- property: alsoDependsOn
  value:
  - fbl.silver.team
schema:
- name: tix_participant
  physicalName: silver.tix_participant
  logicalType: object
  physicalType: table
  description: Teams and performers that take part in events.
  customProperties:
  - property: entity
    value: participant
  properties:
  - name: participant_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Participant id. Primary key. Baseball teams use the FBL team ids.
    primaryKey: true
    primaryKeyPosition: 1
  - name: participant_name
    logicalType: string
    physicalType: STRING
    required: true
    description: participant name
  - name: participant_type
    logicalType: string
    physicalType: STRING
    required: true
    description: team or performer.
  - name: sport
    logicalType: string
    physicalType: STRING
    required: false
    description: Sport for a team; blank for a performer.
  - name: fbl_team_id
    logicalType: string
    physicalType: STRING
    required: false
    description: The FBL team id when this is a baseball team, else blank. Checked against the shared FBL team table.
    relationships:
    - to: fbl_team.team_id
      type: foreignKey
    customProperties:
    - property: sourceColumn
      value: participant_id
    - property: sourceExpression
      value: CASE WHEN trim(sport) = 'baseball' THEN trim(participant_id) END
  quality:
  - name: PAR-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate participant rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: PAR-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: participant_id must identify exactly one participant
    implementation:
      rule_type: unique_strict
      columns:
      - participant_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PAR-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required participant fields must be present
    implementation:
      rule_type: not_null
      columns:
      - participant_id
      - participant_name
      - participant_type
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: PAR-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: participant_type must be team or performer
    implementation:
      rule_type: allowed_values
      columns:
      - participant_type
      expression: '''team'',''performer'''
      action: quarantine
      owner: Data Engineering
  - name: PAR-005
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A baseball team must exist in the shared FBL team table
    implementation:
      rule_type: referential
      columns:
      - fbl_team_id
      expression: silver.fbl_team.team_id
      action: quarantine
      owner: Data Engineering
  - name: PAR-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A performer has no sport
    implementation:
      rule_type: custom
      columns: []
      expression: participant_type <> 'performer' OR sport IS NULL
      action: quarantine
      owner: Data Engineering
