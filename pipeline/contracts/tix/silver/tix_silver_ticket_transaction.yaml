# Silver contract: ticket_transaction. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.ticket_transaction
name: tix ticket_transaction (silver)
version: 1.0.0
status: active
domain: sales
dataProduct: tix
description:
  purpose: 'Every ownership transfer of every ticket: the ledger. Typed, cleaned, deduplicated. Every row has passed every
    quarantine rule.'
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.ticket_transaction
schema:
- name: tix_ticket_transaction
  physicalName: silver.tix_ticket_transaction
  logicalType: object
  physicalType: table
  description: 'Every ownership transfer of every ticket: the ledger.'
  customProperties:
  - property: entity
    value: ticket_transaction
  properties:
  - name: transaction_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Transaction id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: ticket_id
    logicalType: string
    physicalType: STRING
    required: true
    description: The ticket that changed hands.
    relationships:
    - to: tix_ticket_inventory.ticket_id
      type: foreignKey
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event.
    relationships:
    - to: tix_event.event_id
      type: foreignKey
  - name: sale_type
    logicalType: string
    physicalType: STRING
    required: true
    description: primary, resale, buyback or company_resale.
  - name: seller_id
    logicalType: string
    physicalType: STRING
    required: true
    description: PRIMARY, COMPANY or a customer id.
  - name: buyer_id
    logicalType: string
    physicalType: STRING
    required: true
    description: COMPANY or a customer id.
  - name: sale_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Sale time, UTC.
  - name: price
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Ticket price.
  - name: buyer_fee
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Fee charged to the buyer.
  - name: seller_fee
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Fee charged to the seller.
  - name: total_paid
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Price plus buyer fee.
  - name: seller_payout
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: true
    description: Price minus seller fee.
  - name: order_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Order the sale belongs to; blank for buybacks.
  - name: currency
    logicalType: string
    physicalType: STRING
    required: true
    description: currency
  - name: status
    logicalType: string
    physicalType: STRING
    required: true
    description: status
  - name: buyer_customer_id
    logicalType: string
    physicalType: STRING
    required: false
    description: The buyer when it is a customer, else blank.
    relationships:
    - to: tix_customer.customer_id
      type: foreignKey
    customProperties:
    - property: sourceColumn
      value: buyer_id
    - property: sourceExpression
      value: CASE WHEN trim(buyer_id) IN ('COMPANY','PRIMARY') THEN NULL ELSE trim(buyer_id) END
  - name: seller_customer_id
    logicalType: string
    physicalType: STRING
    required: false
    description: The seller when it is a customer, else blank.
    relationships:
    - to: tix_customer.customer_id
      type: foreignKey
    customProperties:
    - property: sourceColumn
      value: seller_id
    - property: sourceExpression
      value: CASE WHEN trim(seller_id) IN ('COMPANY','PRIMARY') THEN NULL ELSE trim(seller_id) END
  quality:
  - name: TXN-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate ticket_transaction rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: TXN-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: One transaction id means one transaction; conflicting copies are all rejected
    implementation:
      rule_type: unique_strict
      columns:
      - transaction_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TXN-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required ledger fields must be present
    implementation:
      rule_type: not_null
      columns:
      - transaction_id
      - ticket_id
      - event_id
      - sale_type
      - seller_id
      - buyer_id
      - sale_ts
      - price
      - buyer_fee
      - seller_fee
      - total_paid
      - seller_payout
      - currency
      - status
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TXN-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: sale_type must be one of the four sale types
    implementation:
      rule_type: allowed_values
      columns:
      - sale_type
      expression: '''primary'',''resale'',''buyback'',''company_resale'''
      action: quarantine
      owner: Data Engineering
  - name: TXN-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Only completed transfers are ledger rows
    implementation:
      rule_type: allowed_values
      columns:
      - status
      expression: '''completed'''
      action: quarantine
      owner: Data Engineering
  - name: TXN-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A price is positive and below 100,000
    implementation:
      rule_type: range
      columns:
      - price
      expression: 0.01 AND 100000
      action: quarantine
      owner: Data Engineering
  - name: TXN-007
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Total paid is price plus buyer fee; payout is price minus seller fee
    implementation:
      rule_type: custom
      columns: []
      expression: total_paid = price + buyer_fee AND seller_payout = price - seller_fee
      action: quarantine
      owner: Data Engineering
  - name: TXN-008
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A buyback is bought by the company
    implementation:
      rule_type: custom
      columns: []
      expression: sale_type <> 'buyback' OR buyer_id = 'COMPANY'
      action: quarantine
      owner: Data Engineering
  - name: TXN-009
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A company resale is sold by the company
    implementation:
      rule_type: custom
      columns: []
      expression: sale_type <> 'company_resale' OR seller_id = 'COMPANY'
      action: quarantine
      owner: Data Engineering
  - name: TXN-010
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A primary sale is sold by the box office
    implementation:
      rule_type: custom
      columns: []
      expression: sale_type <> 'primary' OR seller_id = 'PRIMARY'
      action: quarantine
      owner: Data Engineering
  - name: TXN-011
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The ticket must exist
    implementation:
      rule_type: referential
      columns:
      - ticket_id
      expression: silver.tix_ticket_inventory.ticket_id
      action: quarantine
      owner: Data Engineering
  - name: TXN-012
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The event must exist
    implementation:
      rule_type: referential
      columns:
      - event_id
      expression: silver.tix_event.event_id
      action: quarantine
      owner: Data Engineering
  - name: TXN-013
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A customer buyer must exist
    implementation:
      rule_type: referential
      columns:
      - buyer_customer_id
      expression: silver.tix_customer.customer_id
      action: quarantine
      owner: Data Engineering
  - name: TXN-014
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: A customer seller must exist
    implementation:
      rule_type: referential
      columns:
      - seller_customer_id
      expression: silver.tix_customer.customer_id
      action: quarantine
      owner: Data Engineering
  - name: TXN-015
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: Tickets cannot be sold after the event starts
    implementation:
      rule_type: join_check
      columns: []
      expression: silver.tix_event|event_id=event_id|sale_ts >= _p_start_ts
      action: quarantine
      owner: Data Engineering
