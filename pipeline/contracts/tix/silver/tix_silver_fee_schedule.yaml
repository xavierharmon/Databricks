# Silver contract: fee_schedule. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.fee_schedule
name: tix fee_schedule (silver)
version: 1.0.0
status: active
domain: sales
dataProduct: tix
description:
  purpose: Fee rates in basis points by sale type and event category, with effective dates. Typed, cleaned, deduplicated.
    Every row has passed every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.fee_schedule
schema:
- name: tix_fee_schedule
  physicalName: silver.tix_fee_schedule
  logicalType: object
  physicalType: table
  description: Fee rates in basis points by sale type and event category, with effective dates.
  customProperties:
  - property: entity
    value: fee_schedule
  properties:
  - name: rule_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Fee rule id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: sale_type
    logicalType: string
    physicalType: STRING
    required: true
    description: sale type
  - name: event_category
    logicalType: string
    physicalType: STRING
    required: true
    description: event category
  - name: buyer_fee_bps
    logicalType: integer
    physicalType: INT
    required: true
    description: Buyer fee in basis points (1200 = 12 percent).
  - name: seller_fee_bps
    logicalType: integer
    physicalType: INT
    required: true
    description: Seller fee in basis points.
  - name: effective_from
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Rule applies from this time, UTC.
  - name: effective_to
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: false
    description: Rule applies until this time; blank if open ended.
  quality:
  - name: FEE-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate fee_schedule rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: FEE-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: rule_id must identify exactly one rule
    implementation:
      rule_type: unique_strict
      columns:
      - rule_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: FEE-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required fee fields must be present
    implementation:
      rule_type: not_null
      columns:
      - rule_id
      - sale_type
      - event_category
      - buyer_fee_bps
      - seller_fee_bps
      - effective_from
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: FEE-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: sale_type must be one of the four sale types
    implementation:
      rule_type: allowed_values
      columns:
      - sale_type
      expression: '''primary'',''resale'',''buyback'',''company_resale'''
      action: quarantine
      owner: Data Engineering
  - name: FEE-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: event_category must be sport or concert
    implementation:
      rule_type: allowed_values
      columns:
      - event_category
      expression: '''sport'',''concert'''
      action: quarantine
      owner: Data Engineering
  - name: FEE-006
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Buyer fee is between 0 and 50 percent
    implementation:
      rule_type: range
      columns:
      - buyer_fee_bps
      expression: 0 AND 5000
      action: quarantine
      owner: Data Engineering
  - name: FEE-007
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Seller fee is between 0 and 50 percent
    implementation:
      rule_type: range
      columns:
      - seller_fee_bps
      expression: 0 AND 5000
      action: quarantine
      owner: Data Engineering
