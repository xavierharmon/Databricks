# Silver contract: event_tag. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.event_tag
name: tix event_tag (silver)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: Tags that describe events, many to many. Typed, cleaned, deduplicated. Every row has passed every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.event_tag
schema:
- name: tix_event_tag
  physicalName: silver.tix_event_tag
  logicalType: object
  physicalType: table
  description: Tags that describe events, many to many.
  customProperties:
  - property: entity
    value: event_tag
  properties:
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event.
    primaryKey: true
    primaryKeyPosition: 1
    relationships:
    - to: tix_event.event_id
      type: foreignKey
  - name: tag
    logicalType: string
    physicalType: STRING
    required: true
    description: Tag such as rivalry or family_friendly.
    primaryKey: true
    primaryKeyPosition: 2
    customProperties:
    - property: standardize
      value: lower
  quality:
  - name: ETG-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate event_tag rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: ETG-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: A tag appears once per event
    implementation:
      rule_type: unique_strict
      columns:
      - event_id
      - tag
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: ETG-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required fields must be present
    implementation:
      rule_type: not_null
      columns:
      - event_id
      - tag
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: ETG-004
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The event must exist
    implementation:
      rule_type: referential
      columns:
      - event_id
      expression: silver.tix_event.event_id
      action: quarantine
      owner: Data Engineering
