# Silver contract: ga_event. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.ga_event
name: tix ga_event (silver)
version: 1.0.0
status: active
domain: customer
dataProduct: tix
description:
  purpose: Web analytics events, parsed from the raw JSON. Typed, cleaned, deduplicated. Every row has passed every quarantine
    rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.ga_event
schema:
- name: tix_ga_event
  physicalName: silver.tix_ga_event
  logicalType: object
  physicalType: table
  description: Web analytics events, parsed from the raw JSON.
  customProperties:
  - property: entity
    value: ga_event
  properties:
  - name: event_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: Event time, UTC.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: date_format(timestamp_micros(from_json(raw_json, 'event_timestamp BIGINT').event_timestamp), 'yyyy-MM-dd HH:mm:ss')
  - name: event_name
    logicalType: string
    physicalType: STRING
    required: true
    description: page_view, view_item, login, begin_checkout, purchase ...
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id STRING, user_id
        STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>, items ARRAY<STRUCT<item_id:
        STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING, quantity: BIGINT>>, ecommerce
        STRUCT<transaction_id: STRING>'').event_name'
  - name: user_pseudo_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Anonymous browser id.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id STRING, user_id
        STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>, items ARRAY<STRUCT<item_id:
        STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING, quantity: BIGINT>>, ecommerce
        STRUCT<transaction_id: STRING>'').user_pseudo_id'
  - name: user_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Customer id once the visitor logged in.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id STRING, user_id
        STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>, items ARRAY<STRUCT<item_id:
        STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING, quantity: BIGINT>>, ecommerce
        STRUCT<transaction_id: STRING>'').user_id'
  - name: ga_session_id
    logicalType: integer
    physicalType: INT
    required: true
    description: Session id.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(filter(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').event_params, x -> x.key = ''ga_session_id''), 1).value.int_value'
  - name: page_event_id
    logicalType: string
    physicalType: STRING
    required: false
    description: The event whose page was viewed.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(filter(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').event_params, x -> x.key = ''event_id''), 1).value.string_value'
  - name: client_fp
    logicalType: string
    physicalType: STRING
    required: false
    description: First-party browser fingerprint hash.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(filter(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').event_params, x -> x.key = ''client_fp''), 1).value.string_value'
  - name: ip_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Hash of the network address.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(filter(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').event_params, x -> x.key = ''ip_hash''), 1).value.string_value'
  - name: email_hash
    logicalType: string
    physicalType: STRING
    required: false
    description: Email hash carried by a guest checkout.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(filter(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').event_params, x -> x.key = ''email_hash''), 1).value.string_value'
  - name: transaction_id
    logicalType: string
    physicalType: STRING
    required: false
    description: Order id on a purchase event.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id STRING, user_id
        STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>, items ARRAY<STRUCT<item_id:
        STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING, quantity: BIGINT>>, ecommerce
        STRUCT<transaction_id: STRING>'').ecommerce.transaction_id'
  - name: item_price
    logicalType: number
    physicalType: DECIMAL(12,2)
    required: false
    description: Price shown on the page.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').items, 1).price'
  - name: item_section
    logicalType: string
    physicalType: STRING
    required: false
    description: Section shown on the page.
    customProperties:
    - property: sourceColumn
      value: raw_json
    - property: sourceExpression
      value: 'try_element_at(from_json(raw_json, ''event_date STRING, event_timestamp BIGINT, event_name STRING, user_pseudo_id
        STRING, user_id STRING, event_params ARRAY<STRUCT<key: STRING, value: STRUCT<string_value: STRING, int_value: BIGINT>>>,
        items ARRAY<STRUCT<item_id: STRING, item_name: STRING, item_category: STRING, item_variant: STRING, price: STRING,
        quantity: BIGINT>>, ecommerce STRUCT<transaction_id: STRING>'').items, 1).item_variant'
  quality:
  - name: GAE-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate ga_event rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: GAE-002
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required analytics fields must be present
    implementation:
      rule_type: not_null
      columns:
      - event_ts
      - event_name
      - user_pseudo_id
      - ga_session_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: GAE-003
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A known event name
    implementation:
      rule_type: allowed_values
      columns:
      - event_name
      expression: '''page_view'',''view_item'',''add_to_cart'',''begin_checkout'',''purchase'',''login'',''sign_up'',''search'''
      action: quarantine
      owner: Data Engineering
