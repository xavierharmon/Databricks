# Silver contract: customer. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.customer
name: tix customer (silver)
version: 1.0.0
status: active
domain: customer
dataProduct: tix
description:
  purpose: Customer records. A person can have more than one record; identity resolution merges them later. Typed, cleaned,
    deduplicated. Every row has passed every quarantine rule.
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.customer
schema:
- name: tix_customer
  physicalName: silver.tix_customer
  logicalType: object
  physicalType: table
  description: Customer records. A person can have more than one record; identity resolution merges them later.
  customProperties:
  - property: entity
    value: customer
  properties:
  - name: customer_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Customer record id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: first_name
    logicalType: string
    physicalType: STRING
    required: true
    description: first name
  - name: last_name
    logicalType: string
    physicalType: STRING
    required: true
    description: last name
  - name: email_hash
    logicalType: string
    physicalType: STRING
    required: true
    description: Hash of the email address, never the address.
  - name: phone_hash
    logicalType: string
    physicalType: STRING
    required: true
    description: Hash of the phone number.
  - name: postal_code
    logicalType: string
    physicalType: STRING
    required: true
    description: postal code
  - name: favorite_sport
    logicalType: string
    physicalType: STRING
    required: false
    description: Sport the customer declared as a favourite (baseball, football, basketball or concert); blank if none.
  - name: created_ts
    logicalType: timestamp
    physicalType: TIMESTAMP
    required: true
    description: When the record was created, UTC.
  quality:
  - name: CUS-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate customer rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: CUS-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: customer_id must identify exactly one record
    implementation:
      rule_type: unique_strict
      columns:
      - customer_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: CUS-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required customer fields must be present
    implementation:
      rule_type: not_null
      columns:
      - customer_id
      - first_name
      - last_name
      - email_hash
      - phone_hash
      - postal_code
      - created_ts
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: CUS-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: Postal code has five characters
    implementation:
      rule_type: custom
      columns: []
      expression: length(postal_code) = 5
      action: quarantine
      owner: Data Engineering
  - name: CUS-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A declared favourite is one of the four kinds of event
    implementation:
      rule_type: allowed_values
      columns:
      - favorite_sport
      expression: '''baseball'',''football'',''basketball'',''concert'''
      action: quarantine
      owner: Data Engineering
