# Silver contract: ticket_inventory. Generated by tools/build_tix_contracts.py. Rules are executed by the DQ engine.
apiVersion: v3.1.0
kind: DataContract
id: tix.silver.ticket_inventory
name: tix ticket_inventory (silver)
version: 1.0.0
status: active
domain: events
dataProduct: tix
description:
  purpose: 'Every ticket that exists for an event: a reserved seat or a general-admission place. Typed, cleaned, deduplicated.
    Every row has passed every quarantine rule.'
  limitations: Rejected rows are not here; they are in governance.dq_quarantine with the reason.
  usage: Internal layer. Consumers read gold or the semantic layer.
tags:
- tix
- silver
customProperties:
- property: layer
  value: silver
- property: owner
  value: Data Engineering
- property: dependsOn
  value: tix.source.ticket_inventory
schema:
- name: tix_ticket_inventory
  physicalName: silver.tix_ticket_inventory
  logicalType: object
  physicalType: table
  description: 'Every ticket that exists for an event: a reserved seat or a general-admission place.'
  customProperties:
  - property: entity
    value: ticket_inventory
  properties:
  - name: ticket_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Ticket id. Primary key.
    primaryKey: true
    primaryKeyPosition: 1
  - name: event_id
    logicalType: string
    physicalType: STRING
    required: true
    description: Event.
    relationships:
    - to: tix_event.event_id
      type: foreignKey
  - name: section
    logicalType: string
    physicalType: STRING
    required: true
    description: section
  - name: row
    logicalType: string
    physicalType: STRING
    required: false
    description: Row; blank for general admission.
  - name: seat
    logicalType: string
    physicalType: STRING
    required: false
    description: Seat; blank for general admission.
  - name: admission
    logicalType: string
    physicalType: STRING
    required: true
    description: reserved or general.
  quality:
  - name: TIK-001
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: warning
    description: Identical duplicate ticket_inventory rows are removed automatically (first copy kept)
    implementation:
      rule_type: exact_duplicate
      columns: '*'
      expression: ''
      action: dedupe
      owner: Data Engineering
  - name: TIK-002
    type: custom
    engine: fbl-dq-engine
    dimension: uniqueness
    severity: error
    description: ticket_id must identify exactly one ticket
    implementation:
      rule_type: unique_strict
      columns:
      - ticket_id
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TIK-003
    type: custom
    engine: fbl-dq-engine
    dimension: completeness
    severity: error
    description: Required ticket fields must be present
    implementation:
      rule_type: not_null
      columns:
      - ticket_id
      - event_id
      - section
      - admission
      expression: ''
      action: quarantine
      owner: Data Engineering
  - name: TIK-004
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: admission must be reserved or general
    implementation:
      rule_type: allowed_values
      columns:
      - admission
      expression: '''reserved'',''general'''
      action: quarantine
      owner: Data Engineering
  - name: TIK-005
    type: custom
    engine: fbl-dq-engine
    dimension: conformity
    severity: error
    description: A general-admission ticket has no seat
    implementation:
      rule_type: custom
      columns: []
      expression: admission <> 'general' OR seat IS NULL
      action: quarantine
      owner: Data Engineering
  - name: TIK-006
    type: custom
    engine: fbl-dq-engine
    dimension: consistency
    severity: error
    description: The event must exist
    implementation:
      rule_type: referential
      columns:
      - event_id
      expression: silver.tix_event.event_id
      action: quarantine
      owner: Data Engineering
