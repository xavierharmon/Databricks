# Fictional Baseball League: contracts > bronze > silver (+DQ) > gold (+assertions) > semantic contracts > report.
# Serverless notebook tasks. Every task runs the same notebook with a different `stage`; run_id ties one run together.
resources:
  jobs:
    fbl_dq_pipeline:
      name: fbl-dq-pipeline-${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      # email_notifications:                  # uncomment and set your address: a failed job (rejects, gate or contract failure) emails you
      #   on_failure: ["you@example.com"]
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: setup, run_id: "{{job.run_id}}" }

        # Validates and publishes the contracts (registry + compiled rules). Stops the run if a contract is invalid.
        - task_key: contracts_publish
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: contracts, run_id: "{{job.run_id}}" }

        - task_key: bronze
          depends_on: [{ task_key: contracts_publish }]
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: bronze, run_id: "{{job.run_id}}" }

        - task_key: silver_dq
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: silver, run_id: "{{job.run_id}}" }

        - task_key: gold_assert
          depends_on: [{ task_key: silver_dq }]
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: gold, run_id: "{{job.run_id}}" }

        # Creates the metric views, then checks them against their semantic contracts (interface, golden tests, SLA).
        - task_key: semantic_contracts
          depends_on: [{ task_key: gold_assert }]
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: semantic, run_id: "{{job.run_id}}" }

        # Always runs (even if an earlier task failed) so you get the report. Fails the job when rows were rejected or a
        # contract is broken, which is what triggers the notification. fail_on_rejects "false" = report only.
        - task_key: report_and_notify
          depends_on: [{ task_key: semantic_contracts }]
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/notebooks/fbl_dq_pipeline.py
            base_parameters: { catalog: "${var.catalog}", stage: report, run_id: "{{job.run_id}}", fail_on_rejects: "true" }
