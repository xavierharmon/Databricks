# One job = the whole medallion DAG. Serverless notebook tasks (no cluster spec needed).
resources:
  jobs:
    mlb_medallion:
      name: mlb-medallion-${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/notebooks/00_setup.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: land_files
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../src/notebooks/01_land_files.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: bronze
          depends_on: [{ task_key: land_files }]
          notebook_task:
            notebook_path: ../src/notebooks/02_bronze_ingest.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/notebooks/03_silver.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: silver_quality_gate
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/notebooks/04_quality_gate.py
            base_parameters:
              catalog: "${var.catalog}"
              suite: silver_checks

        - task_key: gold
          depends_on: [{ task_key: silver_quality_gate }]
          notebook_task:
            notebook_path: ../src/notebooks/05_gold.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: gold_quality_gate
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ../src/notebooks/04_quality_gate.py
            base_parameters:
              catalog: "${var.catalog}"
              suite: gold_checks

        - task_key: metric_views
          depends_on: [{ task_key: gold_quality_gate }]
          notebook_task:
            notebook_path: ../src/notebooks/06_metric_views.py
            base_parameters:
              catalog: "${var.catalog}"

        - task_key: governance
          depends_on: [{ task_key: metric_views }]
          notebook_task:
            notebook_path: ../src/notebooks/07_governance.py
            base_parameters:
              catalog: "${var.catalog}"
              analyst_group: "${var.analyst_group}"
              apply_certification: "${var.apply_certification}"
