body: |
  ## Definition
  A team is one franchise with a stable team id (T01 to T08 are the valid ones in the sample data). League is North or South.

  ## Shared reference
  Ticketed baseball events use the same team ids as participants, so ticket sales can be sliced by the team that actually plays.
