body: |
  ## Definition
  OPS is on-base percentage plus slugging percentage.

  ## Why it says approx
  The fictional league records hits, walks and at bats but not hit-by-pitch or sacrifice flies, so on-base percentage is an approximation. Compare OPS only between groups computed the same way.
