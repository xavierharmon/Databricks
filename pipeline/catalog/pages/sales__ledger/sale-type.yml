body: |
  | Sale type | Seller | Buyer |
  | --- | --- | --- |
  | primary | box office inventory | customer |
  | resale | customer | customer |
  | buyback | customer | the company |
  | company resale | the company | customer |

  A buyback creates owned inventory with a cost basis, the price the company paid.
