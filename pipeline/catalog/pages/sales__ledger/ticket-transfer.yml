body: |
  ## Definition
  A transfer records a ticket moving from a seller to a buyer at a price, with the buyer fee, seller fee, total paid and seller payout.

  ## Why a ledger
  A ticket can be sold many times, so ownership is never a column on the ticket. It is the buyer of the most recent transfer.

  ## Rules that must hold
  - This transfer's seller is the previous transfer's buyer.
  - Total paid equals price plus buyer fee; payout equals price minus seller fee.
