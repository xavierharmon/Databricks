body: |
  ## Definition
  Be-backs = visits before purchase minus one. A visit is a session that viewed the event. A buyer who purchased on the first visit has zero be-backs.

  ## Defaults
  - Same event only.
  - Counted by session, within 30 days before the purchase.
  - Only sessions that identity stitching could attribute to the buyer.
