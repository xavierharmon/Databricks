body: |
  ## Definition
  Price at visit is found by an as-of lookup: the latest price change at or before the view time, for the event and section viewed.

  ## Use
  Comparing price at first visit with price at purchase shows whether prices fell while the visitor was deciding. Buyers alone cannot prove cause; compare with visitors who did not buy.
